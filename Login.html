<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign in</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>


    <div class="card">

        <!-- LOGO -->
        <div class="logo">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"
                    fill="white"
                />
            </svg>

        </div>


        <!-- TITLE -->
        <h1>Welcome back</h1>

        <p class="sub">
            Sign in to pick up right where you left off.
        </p>


        <!-- STATUS MESSAGE -->
        <div
            class="status-banner"
            id="statusBanner"
            role="alert"
        ></div>


        <!-- LOGIN FORM -->
        <form
            id="loginForm"
            novalidate
        >

            <!-- EMAIL -->
            <div
                class="field"
                id="emailField"
            >

                <label for="email">
                    Email
                </label>

                <div class="field-input">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="username"
                        required
                    >

                </div>

                <div
                    class="error-msg"
                    id="emailError"
                >
                    Enter a valid email address.
                </div>

            </div>


            <!-- PASSWORD -->
            <div
                class="field"
                id="pwField"
            >

                <label for="password">
                    Password
                </label>

                <div class="field-input">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-pw"
                        id="togglePw"
                    >
                        Show
                    </button>

                </div>

                <div
                    class="error-msg"
                    id="pwError"
                >
                    Password must be at least 8 characters.
                </div>

            </div>


            <!-- REMEMBER / FORGOT -->
            <div class="row-between">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <!-- SIGN IN -->
            <button
                type="submit"
                class="submit-btn"
                id="signInBtn"
            >
                Sign in
            </button>

        </form>


        <!-- DIVIDER -->
        <div class="divider">
            <span>or continue with</span>
        </div>


        <!-- SOCIAL LOGIN -->
        <div class="social-row">

            <button
                type="button"
                class="social-btn"
                id="googleBtn"
            >

                <svg viewBox="0 0 24 24">
                    <path
                        fill="#EA4335"
                        d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.85 1.5l2.6-2.5C16.9 3.4 14.7 2.4 12 2.4 6.9 2.4 2.7 6.6 2.7 11.7s4.2 9.3 9.3 9.3c5.4 0 9-3.8 9-9.1 0-.6-.07-1.1-.15-1.7H12z"
                    />
                </svg>

                Google

            </button>


            <button
                type="button"
                class="social-btn"
                id="githubBtn"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="white"
                >

                    <path
                        d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-1.04-.01-1.89-2.78.62-3.37-1.21-3.37-1.21-.46-1.19-1.11-1.51-1.11-1.51-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .28.18.6.69.5A10.02 10.02 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"
                    />

                </svg>

                GitHub

            </button>

        </div>


        <!-- CREATE ACCOUNT -->
        <p class="alt-action">

            No account?

            <a href="#">
                Create one
            </a>

        </p>

    </div>


    <!-- IMPORTANT:
script.js must be in the SAME folder
as this login.html file.
    -->

    <script src="script.js"></script>

</body>

</html>
